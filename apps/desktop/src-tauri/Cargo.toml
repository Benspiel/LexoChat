[package]
name = "lexichat-desktop"
version = "1.0.0"
description = "LexiChat – interner, Ende-zu-Ende-verschlüsselter Praxis-Messenger"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "lexichat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-notification = "=2.5.1"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-updater = { version = "=2.13.3", default-features = false, features = ["native-tls", "zip"] }
tauri-plugin-process = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = "=0.10.1"
rand = "0.8"
hex = "0.4"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(windows))'.dependencies]
# development builds on other platforms: in-memory fallback (no credential store)

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
