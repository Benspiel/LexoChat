# LexiChat stack: PocketBase (LexiChat build) + Caddy (TLS 1.3, rate limits, admin web app)
#
# Works without any configuration (also on Windows with Docker Desktop):
#   docker compose up -d --build            # in the repo root or in deploy/
#   -> https://admin.localhost (admin web app), https://chat.localhost (api)
# The server secret is generated on first start and kept in the pb_data volume.
#
# Own domain / production: cp .env.example .env, fill in, chmod 600 .env, then
#   docker compose up -d --build
#   ./scripts/create-first-admin.sh
#
# The PocketBase dashboard (/_/) is only reachable via SSH tunnel:
#   ssh -L 8090:127.0.0.1:8090 user@server   ->  http://localhost:8090/_/

name: lexichat

services:
  server:
    build:
      context: ../apps/server
    image: lexichat/server:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      LEXICHAT_TRUST_PROXY: "true"
      LEXICHAT_APP_URL: ${LEXICHAT_APP_URL:-https://${LEXICHAT_DOMAIN:-chat.localhost}}
      LEXICHAT_ADMIN_ORIGIN: ${LEXICHAT_ADMIN_ORIGIN:-https://${LEXICHAT_ADMIN_DOMAIN:-admin.localhost}}
      LEXICHAT_ALLOWED_ORIGINS: ${LEXICHAT_ALLOWED_ORIGINS:-https://${LEXICHAT_ADMIN_DOMAIN:-admin.localhost},http://tauri.localhost}
      LEXICHAT_SUPERUSER_IPS: ${LEXICHAT_SUPERUSER_IPS:-127.0.0.1/32,::1/128,172.16.0.0/12}
    volumes:
      - pb_data:/pb_data
    # only on the loopback interface (SSH tunnel for the superuser dashboard)
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "/app/lexichat", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    build:
      # repo root: the image also builds the admin web app (no Node needed on the host)
      context: ..
      dockerfile: deploy/caddy/Dockerfile
    image: lexichat/caddy:local
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      LEXICHAT_DOMAIN: ${LEXICHAT_DOMAIN:-chat.localhost}
      LEXICHAT_ADMIN_DOMAIN: ${LEXICHAT_ADMIN_DOMAIN:-admin.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-it@praxis.invalid}
      # unset = own local CA (localhost / practice network); empty in .env = Let's Encrypt
      LEXICHAT_TLS: ${LEXICHAT_TLS-internal}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # signed Windows app updates (latest.json + installer + .sig), see docs/betriebshandbuch.md
      - ./updates:/srv/updates:ro
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:

volumes:
  pb_data:
  caddy_data:
  caddy_config:
